# Зсунуті хостові порти — щоб фінальний стек піднімався ПАРАЛЕЛЬНО зі стартером.
# Запуск: docker compose -f docker-compose.yml -f demo-ports.yml up --build -d
# UI фіналу: http://127.0.0.1:4300 (стартер лишається на :4200)
services:
  ui:
    ports: !override ["4300:4200"]
  service:
    ports: !override ["8180:8080"]
  gateway:
    ports: !override ["4100:4000"]
  postgres:
    ports: !override ["15432:5432"]
